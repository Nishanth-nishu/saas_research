{% extends "base.html" %}
{% block title %}Log in · LeadPilot{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Log in to LeadPilot</h1>
  <form method="post" action="/login">
    <label for="email">Email</label><input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus>
    <label for="password">Password</label><input id="password" name="password" type="password" required>
    <p><button>Log in</button></p>
  </form>
  <p class="muted small">New here? <a href="/signup">Set up your coaching centre</a></p>
</div>
{% endblock %}
