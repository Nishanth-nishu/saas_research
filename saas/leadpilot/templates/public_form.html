{% extends "base.html" %}
{% block title %}Free demo class · {{ org.name }}{% endblock %}
{% block content %}
{% set f = form or {} %}
<div class="public {{ '' if embed else 'card' }}">
  {% if not embed %}<h1>{{ org.name }}</h1><p class="muted">Book a free IELTS / PTE demo class. We'll call you to fix a time.</p>{% endif %}
  <form method="post" action="/f/{{ org.slug }}">
    <input type="hidden" name="embed" value="{{ embed }}">
    <div class="hp" aria-hidden="true"><label>Website</label><input name="website" tabindex="-1" autocomplete="off"></div>
    <label for="name">Your name</label><input id="name" name="name" value="{{ f.name or '' }}" required>
    <label for="phone">Mobile / WhatsApp number</label><input id="phone" name="phone" type="tel" value="{{ f.phone or '' }}" placeholder="98xxxxxxxx">
    <label for="email">Email (optional)</label><input id="email" name="email" type="email" value="{{ f.email or '' }}">
    <label for="exam">Which exam?</label>
    <select id="exam" name="exam">{% for e in EXAMS %}<option {{ 'selected' if f.exam == e }}>{{ e }}</option>{% endfor %}</select>
    <label for="target">Target score (if you know it)</label><input id="target" name="target_score" value="{{ f.target_score or '' }}" placeholder="e.g. 7.0 bands / 65">
    <label for="exam_date">When do you plan to take the exam?</label><input id="exam_date" name="exam_date" type="month" value="{{ f.exam_date or '' }}">
    <label for="slot">Preferred class timing</label>
    <select id="slot" name="preferred_slot"><option value="">Any</option>{% for s in SLOTS %}<option {{ 'selected' if f.preferred_slot == s }}>{{ s }}</option>{% endfor %}</select>
    <label for="mode">Classroom or online?</label>
    <select id="mode" name="mode"><option value="">Either</option>{% for m in MODES %}<option {{ 'selected' if f.mode == m }}>{{ m }}</option>{% endfor %}</select>
    <label for="message">Anything else? (current level, country you're applying to…)</label><textarea id="message" name="message">{{ f.message or '' }}</textarea>
    <label><input type="checkbox" name="consent" value="1" {{ 'checked' if f.consent }}> I agree that {{ org.name }} may contact me by phone, WhatsApp or email about my enquiry.</label>
    <p><button>Book my free demo</button></p>
  </form>
</div>
{% endblock %}
